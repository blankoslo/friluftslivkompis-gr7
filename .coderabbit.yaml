language: "en-US"

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!node_modules/**"
    - "!.next/**"
    - "!package-lock.json"
    - "!*.docx"

  path_instructions:
    - path: "src/models/**"
      instructions: |
        Check that Mongoose schemas have indexes on queried fields. Verify all
        relations use ObjectId refs correctly and required fields are explicit.

    - path: "src/app/api/**"
      instructions: |
        Verify all API routes handle errors and return correct HTTP status codes.
        Check that user input is validated before writing to the database.
        Ensure connectToDatabase() is called before every DB operation.

    - path: "src/lib/db/**"
      instructions: |
        Verify the MongoDB connection uses the singleton pattern correctly to
        avoid connection leaks in the Next.js serverless environment.

    - path: "src/**/*.tsx"
      instructions: |
        Check components are accessible (WCAG AA). Ensure loading and error
        states are surfaced to the user. Norwegian text should be used
        consistently throughout the UI.

chat:
  auto_reply: true
